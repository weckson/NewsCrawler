[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newscrawler"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "aiofiles>=23.2",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "prometheus-client>=0.19",
    "protego>=0.3",           # robots.txt parser (RFC 9309)
    "simhash>=2.1",
    "httpx>=0.27",
    "tenacity>=8.2",
    "structlog>=24.1",
    "click>=8.1",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29",
    "psycopg[binary,pool]>=3.1",
]
s3 = [
    "boto3>=1.34",
]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "freezegun>=1.4",
    "aioresponses>=0.7",
    "coverage>=7.4",
]

[tool.setuptools.packages.find]
include = ["crawler*"]

[project.scripts]
newscrawler = "crawler.scheduler:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
